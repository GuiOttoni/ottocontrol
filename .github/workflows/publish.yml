name: Build & Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 0.2.0). Deixe vazio para usar a do package.json."
        required: false

permissions:
  contents: read
  id-token: write # necessário para npm trusted publishing (OIDC)

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*" # always the current Node.js LTS, no manual bumps needed
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package/package-lock.json

      - name: Ensure npm >= 11.5.1 (necessário para trusted publishing)
        run: npm install -g npm@latest

      # Uma release no GitHub (tag "v0.2.0") vira automaticamente a versão
      # publicada no npm — não precisa editar package.json manualmente antes.
      - name: Sync version with release tag
        if: github.event_name == 'release'
        working-directory: package
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Set version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        working-directory: package
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install package dependencies
        working-directory: package
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: package
        run: npm run build

      # Trusted Publisher (OIDC) configurado no npmjs.com para este pacote —
      # nenhum token/secret necessário, npm troca o id-token do job pela
      # autenticação automaticamente.
      - name: Publish to npm
        working-directory: package
        run: npm publish --access public

      - name: Summary
        working-directory: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "### Publicado: ottocontrol@$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/ottocontrol" >> $GITHUB_STEP_SUMMARY
